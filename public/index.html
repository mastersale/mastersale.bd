<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<meta name="description" content="Shop online with fast delivery across Bangladesh.">
<meta name="theme-color" content="#0e5a4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/store.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<div class="announce" id="announce" hidden></div>

<header class="head" id="head">
  <div class="wrap head-in">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <a class="brand" href="/" data-link id="brand">Store</a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="searchInput" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off">
    </form>
    <a class="icon-btn" href="/track" data-link aria-label="Track your order"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg></a>
    <button class="icon-btn cart-btn" id="cartBtn" aria-label="Open cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="cartCount" hidden>0</span></button>
  </div>
</header>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="menuDrawer" aria-label="Menu" aria-hidden="true">
  <div class="drawer-head"><strong>Browse</strong><button class="icon-btn" data-close aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="drawer-body" id="menuLinks"></div>
</aside>
<aside class="drawer right" id="cartDrawer" aria-label="Cart" aria-hidden="true">
  <div class="drawer-head"><strong>Your cart</strong><button class="icon-btn" data-close aria-label="Close cart"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>

<main id="app" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/store.js"></script>
</body>
</html>
