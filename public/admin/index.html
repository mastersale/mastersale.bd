<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>Store admin</h1>
    <p>Sign in to manage products, orders and settings.</p>
    <div id="loginErr" class="err" hidden></div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button class="btn" id="loginBtn">Sign in</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side" id="side">
    <div class="logo" id="logo">Admin</div>
    <nav id="nav">
      <a href="#/" data-r="">Dashboard</a>
      <a href="#/products" data-r="products">Products</a>
      <a href="#/orders" data-r="orders">Orders <em id="pendBadge" hidden></em></a>
      <a href="#/categories" data-r="categories">Categories</a>
      <a href="#/settings" data-r="settings">Store settings</a>
    </nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">View store</a><button id="logout">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="top"><button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="pageTitle">Dashboard</h1><div id="topAct"></div></header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
